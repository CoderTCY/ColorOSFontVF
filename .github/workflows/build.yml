name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test & Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${SIGNING_KEYSTORE_BASE64}" ]]; then
            KEYSTORE_PATH="${RUNNER_TEMP:-/tmp}/release.jks"
            printf '%s' "${SIGNING_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 -d > "${KEYSTORE_PATH}"
            chmod 600 "${KEYSTORE_PATH}"
            echo "SIGNING_STORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "::error::Missing SIGNING_KEYSTORE_BASE64 secret for release signing"
            exit 1
          fi

      - name: Run unit tests and build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify release APK signature
        if: env.SIGNING_STORE_FILE != ''
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          APKSIGNER="$(ls -d "${SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)"
          VERIFY_OUT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          echo "$VERIFY_OUT"
          grep -q "CN=ColorOSFontVF" <<< "$VERIFY_OUT"
          if grep -q "Android Debug" <<< "$VERIFY_OUT"; then
            echo "::error::Release APK is unexpectedly signed with the debug certificate"
            exit 1
          fi

      - name: Clean up keystore
        if: always()
        run: rm -f "${SIGNING_STORE_FILE:-}"

      - name: Stage build outputs
        run: |
          mkdir -p dist
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ColorOSFontVF-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/ColorOSFontVF-${VERSION}-release.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ColorOSFontVF-apks
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: ColorOSFontVF-apks
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
